name: Platform test pipeline

vars:
  name: platform
  image: titpetric/${{name}}
  coverpkg: github.com/titpetric/platform/...

env:
  include:
    - .env.test

jobs:
  default:
    desc: "Format, lint and test"
    steps:
      - task: go:generate
      - task: go:fmt
      - task: go:lint
      - task: go:test
      - task: tests

  tests:
    desc: "Tidy, lint and run the tests module"
    passthru: true
    tty: true
    steps:
      - dir: tests
        run: go mod tidy
      # pairing wants a source file beside every _test.go and modcheck
      # objects to the replace directive. Both are what a test only module
      # is, so the suite runs without them.
      - dir: tests
        run: splint --linters godoc,imports,func-args,func-returns,coverage,grouping,wraphandler,filecheck,visibility,selfcontained ./... || true
      - dir: tests
        run: gotestsum -- -count=1 -cover -coverpkg=${{coverpkg}} ./...

  test:
    desc: "Run tests with coverage"
    passthru: true
    tty: true
    steps:
      - go test -failfast -race -count=1 -cover -coverpkg=./... -coverprofile=pkg.cov ./...
      - dir: tests
        run: go test -failfast -race -count=1 -cover -coverpkg=${{coverpkg}} -coverprofile=../tests.cov ./...
      # One profile for the whole module. Both runs use the same covermode,
      # so the second file contributes everything but its mode header.
      - tail -n +2 tests.cov >> pkg.cov && rm -f tests.cov

  integration:
    desc: "Run integration tests"
    passthru: true
    tty: true
    steps:
      - go test -tags integration -failfast -race -count=1 -cover -coverpkg=./... -coverprofile=pkg.cov ./...
      - dir: tests
        run: go test -tags integration -failfast -race -count=1 -cover -coverpkg=${{coverpkg}} -coverprofile=../tests.cov ./...
      - tail -n +2 tests.cov >> pkg.cov && rm -f tests.cov

  bench:
    desc: "Run benchmarks"
    passthru: true
    tty: true
    steps:
      - go test -failfast -run='Bench.+' -bench=. -benchmem -cpu 1,2,4 -race -v ./...
      - dir: tests
        run: go test -failfast -run='Bench.+' -bench=. -benchmem -cpu 1,2,4 -race -v ./...

  cover:
    desc: "Generate coverage reports"
    steps:
      - splint docs . > docs/api.md
      - splint coverage --append-coverage=pkg.cov --template docs/testing-coverage.md.tpl ./... > docs/testing-coverage.md
      - task: diagrams
      - task: mdox:fmt

  diagrams:
    desc: "Regenerate the structural diagrams"
    # Both diagrams are derived files. Edit the source, not the puml or svg.
    steps:
      - splint docs --render imports ./... > docs/imports.puml
      - splint docs --render puml ./... > docs/structure.puml
      - dir: docs
        run: plantuml -tsvg imports.puml structure.puml

  clean:
    desc: "Clean build assets"
    steps:
      - go clean -cache
      - go clean -testcache
      - rm -f ./${{name}} pkg.cov pkg.cov.json tests.cov splint.json
