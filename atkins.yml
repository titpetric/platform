name: Platform test pipeline

vars:
  name: platform
  image: titpetric/${{name}}

env:
  include:
    - .env.test

jobs:
  default:
    desc: "Format, lint and test"
    steps:
      - task: go:generate
      - task: go:fmt
      - task: go:lint
      - task: go:test

  test:
    desc: "Run tests with coverage"
    passthru: true
    tty: true
    steps:
      - go test -failfast -race -count=1 -cover -coverpkg=./... -coverprofile=pkg.cov ./...

  integration:
    desc: "Run integration tests"
    passthru: true
    tty: true
    steps:
      - go test -tags integration -failfast -race -count=1 -cover -coverpkg=./... -coverprofile=pkg.cov ./...

  bench:
    desc: "Run benchmarks"
    passthru: true
    tty: true
    steps:
      - go test -failfast -run='Bench.+' -bench=. -benchmem -cpu 1,2,4 -race -v ./...

  cover:
    desc: "Generate coverage reports"
    steps:
      - defer: rm -f splint.json
      - splint -include-sources -save . || true
      - go-fsck docs -i splint.json > docs/api.md
      - task: mdox:fmt
      # The extract reads the profile itself, so the coverage is in the
      # document splint writes rather than folded in by a second pass over a
      # summary of it. splint exits 1 on a finding, which is not this job.
      - splint -save --append-coverage=pkg.cov ./... || true
      - go-fsck coverage -i splint.json --template docs/testing-coverage.md.tpl > docs/testing-coverage.md
      - task: mdox:fmt

  clean:
    desc: "Clean build assets"
    steps:
      - go clean -cache
      - go clean -testcache
      - rm -f ./${{name}} pkg.cov pkg.cov.json splint.json go-fsck.json
